[Hardware]
# 传感器设计量程 (g)
sensor_full_scale_g = 240
# 离心机实际测试量程 (g)
centrifuge_test_g = 160
# 量程换算折算比例 (240 / 160)
scale_factor = 1.5

# 供电板数量与每板传感器通道数
board_count = 4
sensors_per_board = 6
total_channels = 24

# 4-in-1 分组总数 (24 / 4)
groups_4in1_count = 6

[Calibration]
# 标定公式核心分子: 961 * 2^20 = 1007681536
const_numerator = 1007681536

# Span 合理性门禁阈值 [S_min, S_max]
# 防止除零、严重溢出或断路畸变
span_min = 600
span_max = 3600

# 阶跃突变检测与自适应稳态提取参数 (需求 3 & 需求 8)
# 阶跃突变判定门限 (LSB): 码值突变超过此阈值即判定加速度加载
step_threshold_lsb = 100.0
# 稳态采样点数上限: 设为 0 表示自适应提取整段稳态全部数据，彻底解除固定 50 点限制
steady_points_max = 0
# 动态过渡态过滤参数 (丢弃离心机启动爬坡过渡帧数)
discard_frames = 30

# MTP TRIM 使能寄存器与位
mtp_trim_enable_reg = CFG22
mtp_trim_enable_bit = 13

[Fixtures]
# A/B 工装加速度物理极性定义
# Axis1: Fixture A -> 正向 (+), Fixture B -> 负向 (-)
# Axis2: Fixture A -> 负向 (-), Fixture B -> 正向 (+)
axis1_fixture_a_sign = 1
axis1_fixture_b_sign = -1
axis2_fixture_a_sign = -1
axis2_fixture_b_sign = 1

[Paths]
root_data_dir = data_conlidation
centrifuge2_dir = data_conlidation/Centrifuge2
mtp_template_dir = data_conlidation/MTP_DATA/before-calibration
mtp_output_dir = data_conlidation/MTP_DATA/after-calibration
